[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracedocs"
version = "0.1.0"
description = "Generate a Markdown study-docs package from any codebase, with an evidence trail."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tracedocs contributors" }]
keywords = ["documentation", "codebase", "onboarding", "study", "agent"]
dependencies = []

[project.scripts]
tracedocs = "project_to_study.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["project_to_study"]

[tool.pytest.ini_options]
testpaths = ["tests"]
